# Compile check for the group-nicknames patch on a GitHub-hosted Mac.
# Runs on every push to the "nicknames" branch of this fork.
name: Build group nicknames

on:
  push:
    branches: [ nicknames ]

jobs:
  build:
    runs-on: xcode-27          # standard Apple Silicon runner, free for public repositories
    timeout-minutes: 360

    steps:
      # Uses the patch file committed most recently in this branch, whatever its name
      # (browsers save repeated downloads as nicknames_1.patch, nicknames_2.patch, ...).
      - name: Get the newest patch from this branch
        run: |
          set -e
          git clone --quiet --filter=blob:none --no-checkout --depth 100 --branch "$GITHUB_REF_NAME" "https://github.com/${{ github.repository }}.git" branch
          cd branch
          PATCH=$(git log -1 --format= --name-only --diff-filter=AM -- '*.patch' | head -n 1)
          echo "Using patch: $PATCH"
          git show "HEAD:$PATCH" | tr -d '\r' > "$RUNNER_TEMP/nicknames.patch"
          echo "PATCH_NAME=$PATCH" >> "$GITHUB_ENV"
          wc -l "$RUNNER_TEMP/nicknames.patch"

      - name: Check out Telegram-iOS at the commit the patch was made against
        run: |
          set -e
          git init telegram
          cd telegram
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin fb0e62ba8a147f0821da6aa63c09da7d79a10111
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Apply the patch
        run: |
          cd telegram
          git apply --whitespace=nowarn "$RUNNER_TEMP/nicknames.patch"
          git status --short

      # The repository's fake provisioning profiles expired on 2026-10-30. A simulator
      # build does not need them: Telegram's own switch below builds without profiles.
      - name: Build for the simulator
        run: |
          set -o pipefail
          echo "build --//Telegram:disableProvisioningProfiles" >> "$HOME/.bazelrc"
          cd telegram
          xcodebuild -version
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber=1 \
            --continueOnError 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: List compiler errors on the summary page
        if: always()
        run: |
          {
            echo "## Patch: $PATCH_NAME"
            echo "## Compiler errors"
            echo '```'
            grep -E ": error:|^ERROR:|ld: error|Undefined symbol|duplicate symbol|failed:" "$GITHUB_WORKSPACE/build.log" | sed -E 's#^.*/telegram/##' | sort -u | head -200 || echo "none found"
            echo '```'
            echo "## Last lines of the log"
            echo '```'
            tail -n 60 "$GITHUB_WORKSPACE/build.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
